<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicoRuby · AI stream</title>
<style>
  body { max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; color: #24313a; background: #f7f8fa; font: 17px/1.7 system-ui, sans-serif; }
  h1 { font-size: 2rem; margin-bottom: .3rem; }
  label { display: block; margin-top: 2rem; }
  textarea { box-sizing: border-box; width: 100%; padding: 1rem; font: inherit; border: 1px solid #a6b2bd; border-radius: .5rem; }
  button { padding: .7rem 1.3rem; margin: 1rem .5rem 0 0; font: inherit; border-radius: .5rem; border: 1px solid #2b5267; cursor: pointer; }
  button[type=submit] { background: #2b5267; color: white; }
  button:disabled { opacity: .45; cursor: default; }
  .result { margin-top: 1.5rem; }
  .result h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
  .stream-output { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 4rem; background: white; padding: 1.25rem; border-radius: .5rem; border: 1px solid #d8dee3; }
  .stream-output:empty::before { content: attr(data-empty); color: #84919a; }
  #reasoning { max-height: 18rem; overflow-y: auto; background: #eef3f5; color: #455761; }
  #output { min-height: 8rem; }
  #usage { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem; margin: 0; }
  #usage div { padding: .75rem 1rem; background: white; border: 1px solid #d8dee3; border-radius: .5rem; }
  #usage dt { color: #667984; font-size: .8rem; }
  #usage dd { margin: .15rem 0 0; font-variant-numeric: tabular-nums; }
  #status { color: #526773; }
</style>
<h1>PicoRuby · AI stream</h1>
<p>Workers AIから届いた言葉を、少しずつ表示します。</p>
<form id="chat">
  <label for="prompt">メッセージ</label>
  <textarea id="prompt" rows="3" required maxlength="4000">Rubyと雲をテーマに短い物語を書いてください。</textarea>
  <button id="send" type="submit">送信</button>
  <button id="stop" type="button" disabled>停止</button>
</form>
<p id="status" role="status">送信すると、ここに回答が届きます。</p>
<section class="result" aria-labelledby="reasoning-heading">
  <h2 id="reasoning-heading">推論</h2>
  <article id="reasoning" class="stream-output" data-empty="推論が届くと、ここに表示されます。"></article>
</section>
<section class="result" aria-labelledby="output-heading">
  <h2 id="output-heading">出力</h2>
  <article id="output" class="stream-output" data-empty="回答が届くと、ここに表示されます。"></article>
</section>
<section id="usage-section" class="result" aria-labelledby="usage-heading" hidden>
  <h2 id="usage-heading">利用状況</h2>
  <dl id="usage">
    <div><dt>入力トークン</dt><dd id="prompt-tokens"></dd></div>
    <div><dt>出力トークン</dt><dd id="completion-tokens"></dd></div>
    <div><dt>合計トークン</dt><dd id="total-tokens"></dd></div>
    <div><dt>キャッシュ済みトークン</dt><dd id="cached-tokens"></dd></div>
    <div><dt>総利用ニューロン</dt><dd id="neurons"></dd></div>
  </dl>
</section>
<script type="module" src="/client.js"></script>
</html>
